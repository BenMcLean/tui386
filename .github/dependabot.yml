# Opens one PR a month for all outdated dependencies, npm and GitHub Actions together.
# build.yml runs on it, including the pixel comparison of the four demo pages, so a green PR
# is just version number changes and a red one means one of them broke something.
# Nothing is merged automatically.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule: { interval: monthly }
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
