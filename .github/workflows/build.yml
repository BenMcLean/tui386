# Dependency bumps should be boring. This builds the demo (all four framework pages) and
# compares each page with the Tailwind one, in light and dark. They are the same screen in
# different classes, so a bump (or a change) that breaks an adapter fails here, not months later.
name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run check:parity
      # the screenshots and a diff image for each page that differs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parity, path: parity/ }
