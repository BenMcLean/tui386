# Publishes the demo site (one page per CSS framework) to GitHub Pages. publish.yml calls this
# after a release succeeds. The site is built here and never committed.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# There is no other trigger: the site is a demo of the latest release.
name: pages
on:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v5
