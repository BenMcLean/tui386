# Publishes the demo site (one page per CSS framework) to GitHub Pages when a version tag
# (v1.2.3) is pushed, alongside publish.yml. The site is built here and never committed.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# workflow_dispatch lets you redeploy by hand from the Actions tab.
name: pages
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v5
